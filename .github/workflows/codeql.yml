# For most projects, this workflow file will not need changing; you simply need
name: CodeQL
# to commit it to your repository.
"on":
  #
  push:
    # You may wish to alter this file to override the set of languages analyzed,
    branches:
      # or to provide custom queries or build logic.
      - main
  #
  pull_request:
    # ******** NOTE ********
    branches:
      # We have attempted to detect the languages in your repository. Please check
      - main
  # the `language` matrix defined below to confirm you have the correct set of
  schedule:
    # supported CodeQL languages.
    - cron: 0 0 * * 1
#
permissions:
  contents: read
jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      # The branches below must be a subset of the branches above
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript
          - typescript
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@cb605e52c26070c328afc4562f0b4ada7618a84e
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@17a820bf2e43b47be2c72b39cc905417bc1ab6d0
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        # CodeQL supports [ $supported-codeql-languages ]
        uses: github/codeql-action/autobuild@17a820bf2e43b47be2c72b39cc905417bc1ab6d0
      # Learn more about CodeQL language support at https://aka.ms/codeql-docs/language-support
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@17a820bf2e43b47be2c72b39cc905417bc1ab6d0
        with:
          category: /language:${{matrix.language}}
